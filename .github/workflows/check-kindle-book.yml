# Kindle用英単語帳（kindle/vocab-book）の EPUB を生成し、EPUBCheck で検証するワークフロー
# words.csv や book.json を変更して push すると、壊れていないか自動でチェックします。
# ※ 公開リポジトリのため、生成した EPUB はダウンロード用に保存しません（販売物の流出防止）。
name: Check Kindle vocab book

on:
  push:
    paths:
      - "kindle/**"
      - ".github/workflows/check-kindle-book.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: EPUBを生成
        run: node kindle/vocab-book/build.js
      - name: EPUBCheckで検証（KDPが使うのと同じ形式チェック）
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          for f in kindle/vocab-book/dist/*.epub; do
            java -jar epubcheck-5.1.0/epubcheck.jar "$f"
          done

# 管理職（校長）宛ての夏合宿 会計報告書。
#   python3 -m scripts.kaikei admin-report 2026-summer
# 金額はすべて台帳・合宿設定から計算する。ここに金額は書かない。
title: 2026年度 ラグビー部 夏季合宿 会計報告書
to: 校長　井上 誠二　殿
from: ラグビー部顧問　占部 涼也・畠山 和真
submit_date: ""        # 空なら黄色網掛けの記入欄になる（例: 2026年10月1日）

# 台帳（expenses-2026-summer.csv）の各行を、報告書のどの費目で出すか。
# 人が決める。台帳の行がどこにも入っていないとエラーで止まる。
expense_lines:
  雑費（補食・日用品・洗濯等）: [r002, r003, r004, r005, r006, r007, r008]
  外部コーチ謝礼: [r010]
# 合宿会計に含めず、父母会予算（分類B）で精算するもの
outside_camp:
  対戦校への手土産: [r001]
  生徒の受診料（メディカル）: [r009]

# 確定していないもの。報告書の「未確定事項」に載る
pending:
  - バスの有料道路代・駐車場代（国際興業からの実費請求待ち。上記バス代は見積額）
  - 2人目の外部コーチへの謝礼（1人目の星野コーチ分は計上済み）
  - 合宿中の雑費の一部（領収書を回収・精算中）
attachments:
  - 領収書写し（領収書7枚・菅平ホテル請求書）

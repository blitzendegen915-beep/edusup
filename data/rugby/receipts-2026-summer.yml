  - {receipt: r008, src: ""}   # コインランドリーカード（カード購入のため領収書なしの見込み）
  - {receipt: r009, src: ""}   # 病院代（生徒の受診情報を含むため載せるかは要判断）
  - {receipt: r010, src: ""}   # 星野コーチ謝礼

  - {receipt: r005, src: photo1_0801-0802.jpg, rotate: 270, box: [920, 995, 1570, 2160]}   # 8/2 セブン 18:50（ゼリー）
  - {receipt: r006, src: photo2_0806_hotel.jpg, rotate: 270, box: [1055, 495, 1760, 1850]}   # 8/6 セブン 12:20（クレジット・内訳なし）

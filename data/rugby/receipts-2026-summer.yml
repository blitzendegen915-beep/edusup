# 2026年度 夏合宿の領収書写し。
#   python3 -m scripts.ryoshusho 2026-summer
#
# 写真は data/rugby/receipts/2026-summer/ に置く（git には入れない）。
# 1枚の写真に複数の領収書が写っていてよい。項目ごとに切り出す。
#   src:    写真のファイル名
#   rotate: 時計回りに何度起こすか（90 / 180 / 270）
#   box:    [左, 上, 右, 下]  起こした後の写真での切り抜き範囲（ピクセル）
#   full_page: true  請求書などA4の書類は1ページ使って載せる
# src が空の項目は「領収書の添付なし」として1ページ目の下に列挙される。
title: 2026年度 ラグビー部 夏季合宿 領収書写し
photo_dir: receipts/2026-summer
expenses: expenses-2026-summer.csv
items:
  - {receipt: r001, src: photo1_0801-0802.jpg, rotate: 270, box: [1650, 20, 2205, 2160]}   # 8/1 日本ハイウェイ・サービス（東京ばな奈ほか）
